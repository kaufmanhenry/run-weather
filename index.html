<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Weather — A Weekly Almanac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f7f4ec;
            --paper-deep: #ECE4D0;
            --ink: #1a1813;
            --ink-soft: #2A241D;
            --muted: #7a7466;
            --faint: #B4A795;
            --hairline: rgba(24, 20, 16, 0.12);
            --rule: rgba(24, 20, 16, 0.85);
            --accent: #9C3E26;

            --perfect: #3E5A3A;
            --solid: #3E5A6E;
            --tough: #8C6418;
            --skip: #8E3727;

            --serif: 'Fraunces', 'Times New Roman', serif;
            --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
            /* Suite label face (SUITE.md). Was never loaded here. */
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }


        /* Suite bar — the one cross-suite element, at the foot of every app in
           the family. It used to sit at the top; down here it stays reachable
           without making another product's name the first thing on the page,
           so Run Weather leads with its own masthead.

           Deliberately dark on this light page: the bar is chrome belonging to
           setlist.run, not to Run Weather, so it stays identical across the
           suite whatever the host app's own theme is. Mirror any change on
           setlist.run, training. and gradient. (see SUITE.md). */
        .suitebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 9px 20px;
            background: #16140f;
            border-top: 1px solid rgba(241, 237, 226, 0.13);
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.4;
        }
        .suitebar a { text-decoration: none; white-space: nowrap; }
        .suitebar .hub { color: #f1ede2; letter-spacing: 0.06em; }
        .suitebar .hub span { color: #9a9384; opacity: 0.6; margin-left: 8px; }
        .suitebar nav { display: flex; gap: 18px; flex-wrap: wrap; }
        .suitebar nav a { color: #9a9384; }
        .suitebar nav a:hover { color: #f1ede2; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: var(--paper); }

        body {
            font-family: var(--sans);
            font-variation-settings: "opsz" 14, "SOFT" 40;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.4;
        }

        ::selection { background: var(--ink); color: var(--paper); }

        .container {
            max-width: 620px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ───────── Masthead ───────── */

        .masthead {
            padding: 44px 0 20px;
            border-bottom: 1px solid var(--hairline);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
        }

        .mark {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .title {
            font-family: var(--serif);
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -0.025em;
            line-height: 1;
            font-variation-settings: "opsz" 96, "SOFT" 60;
            color: var(--ink);
        }

        .title em {
            font-style: italic;
            font-weight: 400;
            color: var(--accent);
        }

        .tagline {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ───────── Search ───────── */

        .search {
            padding: 18px 0;
            display: flex;
            gap: 14px;
            align-items: center;
            border-bottom: 1px solid var(--hairline);
        }

        .search-label {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }

        input {
            flex: 1;
            padding: 4px 0;
            background: transparent;
            border: none;
            color: var(--ink);
            font-family: var(--serif);
            font-size: 16px;
            font-style: italic;
            font-variation-settings: "opsz" 24, "SOFT" 30;
            outline: none;
        }

        input::placeholder { color: var(--faint); font-style: italic; }

        button {
            background: transparent;
            border: none;
            color: var(--ink);
            cursor: pointer;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 6px 10px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            transition: background 0.15s, color 0.15s;
        }

        button:hover {
            background: var(--ink);
            color: var(--paper);
        }

        button:disabled { opacity: 0.4; cursor: not-allowed; background: transparent; color: var(--ink); }

        /* ───────── Issue strip ───────── */

        .issue-strip {
            padding: 14px 0;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--hairline);
        }

        .issue-strip .sep { color: var(--faint); margin: 0 8px; }

        /* ───────── The Pick ───────── */

        .pick {
            margin: 0 -24px;
            padding: 32px 24px 36px;
            background: var(--paper-deep);
            border-top: 1px solid var(--hairline);
            border-bottom: 1px solid var(--hairline);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: end;
            animation: rise 0.5s ease-out both;
        }

        .pick-eyebrow {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .pick-when {
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 500;
            font-variation-settings: "opsz" 60, "SOFT" 50;
            line-height: 1.15;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
        }

        .pick-when em {
            font-style: italic;
            font-weight: 400;
            color: var(--muted);
        }

        .pick-stats {
            font-family: var(--sans);
            font-size: 12px;
            color: var(--muted);
            font-feature-settings: "tnum";
            letter-spacing: 0.01em;
        }

        .pick-stats .dot {
            color: var(--faint);
            margin: 0 7px;
        }

        /* The verdict, not a number. This slot used to hold the 0-100 score, set
           at 76px — which read as a measurement and was nothing of the kind: it
           is a made-up index built from hardcoded penalties, so "92" and "89"
           differ by nothing you could feel on a run. The rating word is the
           honest form of the same judgement, and it matches how every other
           window on the page states itself. */
        .pick-verdict {
            font-family: var(--serif);
            font-size: 54px;
            font-style: italic;
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.03em;
            color: var(--ink);
            font-variation-settings: "opsz" 144, "SOFT" 90;
            text-align: right;
        }

        .pick-verdict.perfect     { color: var(--perfect); }
        .pick-verdict.solid       { color: var(--solid); }
        .pick-verdict.challenging { color: var(--tough); }
        .pick-verdict.skip        { color: var(--skip); }

        /* ───────── Day entry ───────── */

        .day-entry {
            padding: 22px 0 24px;
            border-bottom: 1px solid var(--hairline);
            animation: rise 0.4s ease-out both;
        }

        /* The colophon draws its own top rule, so the last entry's bottom rule
           left two hairlines stacked 24px apart at the foot of the page. The
           colophon's is the one that separates the forecast from the credits;
           this one has nothing left to divide. */
        .day-entry:last-child { border-bottom: none; }

        .day-entry:nth-child(2) { animation-delay: 0.04s; }
        .day-entry:nth-child(3) { animation-delay: 0.08s; }
        .day-entry:nth-child(4) { animation-delay: 0.12s; }
        .day-entry:nth-child(5) { animation-delay: 0.16s; }
        .day-entry:nth-child(6) { animation-delay: 0.20s; }
        .day-entry:nth-child(7) { animation-delay: 0.24s; }

        .day-head {
            display: grid;
            /* Two columns since the №01 marker came out: the day name takes the
               slack, the sun times sit hard right. */
            grid-template-columns: 1fr auto;
            gap: 14px;
            align-items: baseline;
            margin-bottom: 18px;
        }

        .day-name {
            font-family: var(--serif);
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.1;
            font-variation-settings: "opsz" 36, "SOFT" 40;
        }

        .day-name em {
            font-style: italic;
            font-weight: 400;
            color: var(--muted);
            font-size: 0.72em;
            margin-left: 8px;
        }

        .day-name.is-today em { color: var(--accent); }

        .day-sun {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--muted);
            font-feature-settings: "tnum";
            white-space: nowrap;
        }

        .day-sun .arrow {
            color: var(--faint);
            margin: 0 3px 0 10px;
        }
        .day-sun .arrow:first-child { margin-left: 0; }

        .day-date {
            display: block;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--faint);
            margin-top: 4px;
        }

        /* ───────── Window ───────── */

        .windows { display: grid; gap: 16px; }

        .window {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 18px;
            align-items: start;
            padding-left: 14px;
            /* One neutral rule, not a rating-coloured one. The verdict word sits
               in this same row already carrying the rating in that colour, so a
               tinted left border was a second, weaker copy of the same signal —
               and a colour-coded left border on a card is the most recognisable
               tell in the genre. The rule stays for structure; colour is the
               verdict's job alone. */
            border-left: 2px solid var(--hairline);
        }

        .window-label {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        /* The hours the label actually covers. Set apart from the name so the
           row still scans as "EARLY MORNING" first and answers "which hours?"
           second, for the reader who stops to ask. */
        .window-hours {
            font-family: var(--mono);
            font-weight: 400;
            letter-spacing: 0.08em;
            color: var(--faint);
            margin-left: 3px;
            /* Opt out of the label's uppercase: the meridiem is lowercase
               everywhere else on the page ("5:45a" in the sun times), and
               "5-9A" reads as a grade. */
            text-transform: none;
        }

        .window-temp {
            font-family: var(--serif);
            font-size: 30px;
            font-style: italic;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--ink);
            font-variation-settings: "opsz" 60, "SOFT" 70;
            font-feature-settings: "tnum";
            display: inline-block;
        }

        .window-feels {
            font-family: var(--sans);
            font-size: 11px;
            color: var(--muted);
            font-feature-settings: "tnum";
            margin-top: 2px;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
        }

        .window-stats {
            font-family: var(--sans);
            font-size: 12px;
            color: var(--ink-soft);
            font-feature-settings: "tnum";
            letter-spacing: 0.01em;
            line-height: 1.5;
        }

        /* Each reading wraps whole. Without this the line breaks mid-stat on a
           phone and strands "humidity" on its own row, away from its number. */
        .window-stats .stat { white-space: nowrap; }

        .window-stats .dot {
            color: var(--faint);
            margin: 0 7px;
        }

        .window-note {
            margin-top: 6px;
            font-family: var(--serif);
            font-size: 12px;
            font-style: italic;
            color: var(--muted);
            font-variation-settings: "opsz" 14;
        }

        .window-note::before {
            content: "— ";
            color: var(--faint);
        }

        .window-rating { text-align: right; align-self: center; }

        .rating-word {
            font-family: var(--serif);
            font-size: 26px;
            font-style: italic;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.015em;
            font-variation-settings: "opsz" 60, "SOFT" 80;
        }

        .window.perfect     .rating-word { color: var(--perfect); }
        .window.solid       .rating-word { color: var(--solid); }
        .window.challenging .rating-word { color: var(--tough); }
        .window.skip        .rating-word { color: var(--skip); }


        /* ───────── States ───────── */

        .loading {
            padding: 60px 0;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 0.01em;
            animation: breathe 1.8s ease-in-out infinite;
            font-variation-settings: "opsz" 18, "SOFT" 50;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        .error {
            padding: 36px 0;
            text-align: center;
            color: var(--skip);
            font-family: var(--serif);
            font-style: italic;
            font-size: 14px;
            border-bottom: 1px solid var(--hairline);
        }

        .error::before { content: "— "; color: var(--faint); }
        .error::after  { content: " —"; color: var(--faint); }

        /* ───────── Colophon ───────── */

        .colophon {
            padding: 40px 0 56px;
            text-align: center;
            border-top: 1px solid var(--hairline);
            margin-top: 24px;
        }

        .colophon-sub {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .colophon-sub a {
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid var(--hairline);
            padding-bottom: 1px;
            transition: color 0.2s, border-color 0.2s;
        }

        .colophon-sub a:hover { color: var(--ink); border-color: var(--ink); }

        .colophon-sub .sep { color: var(--faint); margin: 0 8px; }

        /* ───────── Motion ───────── */

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0);   }
        }

        @media (max-width: 480px) {
            .container { padding: 0 18px; }
            .masthead {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 32px 0 16px;
            }
            .pick {
                grid-template-columns: 1fr auto;
                margin: 0 -18px;
                padding: 26px 18px 28px;
            }
            .pick-when { font-size: 20px; }
            .pick-verdict { font-size: 40px; }
            .day-head {
                grid-template-columns: 1fr;
                row-gap: 6px;
            }
            .day-sun { grid-column: 1 / -1; }
            .window-temp { font-size: 26px; }
            .rating-word { font-size: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <header class="masthead">
            <div class="mark">
                <h1 class="title">Run <em>Weather</em></h1>
            </div>
            <p class="tagline">A Weekly Almanac</p>
        </header>

        <div class="search">
            <span class="search-label">Location</span>
            <input
                type="text"
                id="location"
                placeholder="enter a city or postal code…"
                onkeydown="if(event.key === 'Enter') fetchWeather()"
                autocomplete="off"
                spellcheck="false"
            >
            <button id="goBtn" onclick="fetchWeather()">Read</button>
        </div>

        <div id="results"></div>

        <footer class="colophon">
            <p class="colophon-sub">
                Data, <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a><span id="nws-credit"></span>
                <span class="sep">·</span>
                Set in <a href="https://fonts.google.com/specimen/Fraunces" target="_blank" rel="noopener">Fraunces</a>
            </p>
        </footer>
    </div>

    <footer class="suitebar">
        <a class="hub" href="https://setlist.run">setlist.run<span>suite</span></a>
        <nav>
            <a href="https://setlist.run">Setlist</a>
            <a href="https://training.setlist.run">Training Load</a>
            <a href="https://gradient.setlist.run">Gradient</a>
        </nav>
    </footer>

    <script>
        const STORAGE_KEY = 'run-weather:last-location';
        const DEFAULT_LOCATION = '02131';

        // The two windows the almanac reports on, defined once. "Early Morning"
        // and "Evening" were bare labels with the hours buried in a filter
        // expression, so the page never said what either one meant — you had to
        // guess whether evening started at 4 or at 7. Both ends live here now,
        // and the label renders its own range, so the two cannot drift apart.
        // Hours are inclusive: `to: 9` covers the 9am hour.
        // The two halves of the day the almanac looks in. These are search
        // bounds, not the answer: the hours actually reported are picked inside
        // them per day (see bestStretch), because a fixed block averaged away
        // the thing this page exists to tell you. A 5-9a August morning runs
        // 73° to 81°; one mean over those five hours gives 5a and 9a the same
        // verdict when 5a is a good run and 9a is the worst hour of the
        // morning.
        const BANDS = {
            morning: { label: 'Morning', from: 5,  to: 9  },
            evening: { label: 'Evening', from: 16, to: 20 },
        };

        // Shortest stretch worth reporting. An hour is a run; anything less is
        // a gap between two worse hours, not a window.
        const MIN_STRETCH = 2;

        // How much mean score a longer stretch may give up and still win. Two
        // good hours inside three near-identical ones is a distinction without
        // a difference — prefer the one that gives you room to get out.
        const STRETCH_SLACK = 4;

        // ───────── Heat stress (National Weather Service) ─────────
        //
        // Open-Meteo gives apparent temperature, which is the heat index: a
        // model of a person standing in the shade. This page is for people
        // running in the sun, and for that the discipline has its own metric —
        // wet bulb globe temperature, which folds in solar load and wind and is
        // what ACSM and interscholastic athletics set practice limits on.
        // Open-Meteo does not carry it (its wet_bulb_temperature_2m is a
        // different quantity, no globe term). NWS does.
        //
        // The gap is not academic. Roslindale on a hot August afternoon reads
        // 91-98°F apparent, which sounds like cancel; WBGT for the same hours
        // is 81-86°F, which is "caution, take more rest".
        //
        // US only, so this is a layer on top of Open-Meteo rather than a
        // replacement: no grid, no WBGT, and the page falls back to feels-like
        // exactly as before. api.weather.gov sends
        // access-control-allow-origin: *, so the static page can call it
        // directly. It 403s an empty User-Agent, which browsers never send.

        const NWS_POINTS = 'https://api.weather.gov/points';

        // Grid values arrive as ISO 8601 intervals of varying length ("PT1H",
        // "PT2H", "P1DT6H") and every variable is segmented differently — one
        // pull had 152 temperature entries against 69 for dewpoint. Expanding
        // each to a flat hourly map is what makes them joinable.
        function isoDurationHours(duration) {
            const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?)?/.exec(duration || '');
            if (!m) return 1;
            return Math.max(1, (+(m[1] || 0)) * 24 + (+(m[2] || 0)));
        }

        // Grid times are absolute UTC; Open-Meteo hours are the location's
        // local wall clock. Shifting by the location's offset and then reading
        // the result as UTC gives that wall clock back, so both sides key the
        // same way and the join survives the user being in another timezone.
        function localHourKey(utcMs, offsetSeconds) {
            return new Date(utcMs + offsetSeconds * 1000).toISOString().slice(0, 13);
        }

        function expandGrid(series, offsetSeconds, transform = v => v) {
            const out = new Map();
            if (!series || !Array.isArray(series.values)) return out;
            for (const { validTime, value } of series.values) {
                if (value === null || value === undefined) continue;
                const [startIso, duration] = String(validTime).split('/');
                const startMs = Date.parse(startIso);
                if (Number.isNaN(startMs)) continue;
                const span = isoDurationHours(duration);
                for (let i = 0; i < span; i++) {
                    out.set(localHourKey(startMs + i * 3600000, offsetSeconds), transform(value));
                }
            }
            return out;
        }

        // Null whenever NWS has nothing for this point — outside the US, or the
        // service is down. Never throws: this is an enhancement, and losing it
        // should cost the reader nothing but the extra precision.
        async function fetchHeatStress(lat, lon, offsetSeconds) {
            try {
                const pointRes = await fetch(`${NWS_POINTS}/${lat.toFixed(4)},${lon.toFixed(4)}`);
                if (!pointRes.ok) return null;
                const gridUrl = (await pointRes.json()).properties?.forecastGridData;
                if (!gridUrl) return null;

                const gridRes = await fetch(gridUrl);
                if (!gridRes.ok) return null;
                const grid = (await gridRes.json()).properties;

                const wbgt = expandGrid(grid.wetBulbGlobeTemperature, offsetSeconds, c => c * 9 / 5 + 32);
                if (wbgt.size === 0) return null;
                return { wbgt, thunder: expandGrid(grid.probabilityOfThunder, offsetSeconds) };
            } catch (e) {
                return null;
            }
        }

        // "2026-08-11" -> local midnight on that calendar day.
        //
        // new Date("2026-08-11") reads a bare date as UTC midnight, which
        // anywhere west of Greenwich lands on the evening *before*. Every day
        // block was therefore labelled one day behind the data it held: the
        // entry headed Tuesday was showing Wednesday's forecast.
        function dateFromLocalKey(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        const hourLabel = (h) => `${h % 12 === 0 ? 12 : h % 12}${h < 12 ? 'a' : 'p'}`;

        // "5–7a" when both ends share a meridiem, "11a–1p" when they don't.
        // `to` is the last whole hour included, so it reads as its start time.
        const hourSpan = (from, to) =>
            (from < 12) === (to < 12)
                ? `${hourLabel(from).slice(0, -1)}–${hourLabel(to)}`
                : `${hourLabel(from)}–${hourLabel(to)}`;

        // Open-Meteo returns sunrise/sunset as local ISO strings ("...T05:45").
        const isoHour = (s) => (s ? parseInt(s.slice(11, 13), 10) : null);

        // Clip a band to the hours with daylight in them. The API already sends
        // sunrise and sunset and the page only ever printed them in the header,
        // so in December it would happily recommend 5a and 8p in Boston — both
        // pitch dark — with the sun times sitting on the same row. The hour
        // containing sunrise or sunset counts as usable.
        function daylightBand(band, sun) {
            const rise = isoHour(sun && sun.sunrise);
            const set  = isoHour(sun && sun.sunset);
            const from = rise === null ? band.from : Math.max(band.from, rise);
            const to   = set  === null ? band.to   : Math.min(band.to, set);
            return from > to ? null : { ...band, from, to };
        }

        // The best contiguous run of hours in a band, by mean hourly score.
        // Every candidate stretch of MIN_STRETCH or more is scored; among those
        // within STRETCH_SLACK of the winner, the longest wins, earliest on a
        // tie. Bands are five hours, so the quadratic scan is free.
        function bestStretch(hours) {
            if (hours.length === 0) return null;

            const minLen = Math.min(MIN_STRETCH, hours.length);
            const candidates = [];
            for (let i = 0; i < hours.length; i++) {
                for (let n = minLen; i + n <= hours.length; n++) {
                    const slice = hours.slice(i, i + n);
                    candidates.push({
                        hours: slice,
                        mean: slice.reduce((s, h) => s + h.score, 0) / n,
                    });
                }
            }

            // Hold the target still. Comparing each candidate against a `best`
            // that is being reassigned inside the same loop lets every slightly
            // worse, slightly longer stretch reset the bar it just cleared, and
            // the whole band wins by creep every time.
            const topMean = Math.max(...candidates.map(c => c.mean));
            return candidates
                .filter(c => c.mean >= topMean - STRETCH_SLACK)
                .sort((a, b) =>
                    b.hours.length - a.hours.length ||
                    a.hours[0].hour - b.hours[0].hour)[0];
        }

        async function fetchWeather() {
            const input = document.getElementById('location');
            const btn = document.getElementById('goBtn');
            const location = input.value.trim();
            const results = document.getElementById('results');

            if (!location) {
                results.innerHTML = '<div class="error">enter a location</div>';
                return;
            }

            btn.disabled = true;
            results.innerHTML = '<div class="loading">gathering readings…</div>';

            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error('location not found');
                }

                const { latitude, longitude, name, admin1, country_code } = geoData.results[0];
                const label = [name, admin1, country_code].filter(Boolean).join(', ');

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,apparent_temperature,precipitation_probability,windspeed_10m,relative_humidity_2m,dew_point_2m&daily=sunrise,sunset&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=7`);
                const weather = await weatherRes.json();

                const heat = await fetchHeatStress(latitude, longitude, weather.utc_offset_seconds || 0);

                localStorage.setItem(STORAGE_KEY, location);
                displayForecast(weather, label, heat);
            } catch (error) {
                results.innerHTML = `<div class="error">${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function displayForecast(weather, locationName, heat) {
            const results = document.getElementById('results');

            // Credit NWS only where it actually contributed, so a reader
            // outside the US is not told about a source that had nothing for
            // their location.
            const credit = document.getElementById('nws-credit');
            if (credit) {
                credit.innerHTML = heat
                    ? ' + <a href="https://www.weather.gov" target="_blank" rel="noopener">NWS</a>'
                    : '';
            }

            const days = {};

            // "Now" and "today" belong to the place being looked up, not to the
            // reader. Shifting by the location's offset and reading the result
            // through the UTC getters gives its wall clock, so checking Tokyo
            // from Boston still says Today about Tokyo's today.
            const offsetSec = weather.utc_offset_seconds || 0;
            const nowThere = new Date(Date.now() + offsetSec * 1000);
            const todayKey = nowThere.toISOString().slice(0, 10);
            const tomorrowKey = new Date(nowThere.getTime() + 86400000).toISOString().slice(0, 10);
            const hourThere = nowThere.getUTCHours();

            weather.hourly.time.forEach((time, i) => {
                // Read the calendar day and hour straight off Open-Meteo's
                // local timestamp. Going via new Date().toISOString() converted
                // back to UTC first, which west of Greenwich pushed every hour
                // from 8pm onward into the following day's bucket — so each day
                // was built from its own 00:00-19:00 plus the previous
                // evening's tail.
                const dayKey = time.slice(0, 10);
                // Local wall clock, "2026-08-08T05:00" -> "2026-08-08T05".
                const key = String(time).slice(0, 13);
                if (!days[dayKey]) days[dayKey] = [];
                days[dayKey].push({
                    hour: +time.slice(11, 13),
                    temp: weather.hourly.temperature_2m[i],
                    feelsLike: weather.hourly.apparent_temperature[i],
                    precip: weather.hourly.precipitation_probability[i],
                    wind: weather.hourly.windspeed_10m[i],
                    humidity: weather.hourly.relative_humidity_2m[i],
                    dewPoint: weather.hourly.dew_point_2m[i],
                    wbgt: heat ? heat.wbgt.get(key) : undefined,
                    thunder: heat ? heat.thunder.get(key) : undefined
                });
            });

            const sunByDay = {};
            if (weather.daily && weather.daily.time) {
                weather.daily.time.forEach((d, i) => {
                    sunByDay[d] = {
                        sunrise: weather.daily.sunrise[i],
                        sunset: weather.daily.sunset[i]
                    };
                });
            }

            const candidates = [];
            const dayBlocks = [];

            Object.entries(days).forEach(([dateStr, hours]) => {
                // ISO dates sort and compare correctly as plain strings, which
                // sidesteps another round trip through Date.
                if (dateStr < todayKey) return;
                const date = dateFromLocalKey(dateStr);
                const isTodayThere = dateStr === todayKey;

                let primary, secondary;
                if (isTodayThere)                    { primary = 'Today';    secondary = date.toLocaleDateString('en-US', { weekday: 'long' }); }
                else if (dateStr === tomorrowKey)    { primary = 'Tomorrow'; secondary = date.toLocaleDateString('en-US', { weekday: 'long' }); }
                else                                 { primary = date.toLocaleDateString('en-US', { weekday: 'long' }); secondary = ''; }

                const dateFormatted = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const isToday = isTodayThere;

                // Hours already spent are not a recommendation. At half six in
                // the evening the page was still offering this morning's 5-10a
                // as somewhere to run.
                const ahead = isTodayThere ? hours.filter(h => h.hour >= hourThere) : hours;

                const sun = sunByDay[dateStr];
                const morning = summarize(BANDS.morning, sun, ahead);
                const evening = summarize(BANDS.evening, sun, ahead);

                // A day whose windows have all passed has nothing left to say.
                if (!morning && !evening) return;

                [morning, evening].forEach(w => {
                    if (w) candidates.push({ ...w, dayLabel: primary });
                });

                dayBlocks.push({
                    primary, secondary, dateFormatted, isToday,
                    sun, morning, evening
                });
            });

            const best = candidates
                .filter(c => c.rating.class === 'perfect' || c.rating.class === 'solid')
                .sort((a, b) => b.score - a.score)[0]
                || candidates.sort((a, b) => b.score - a.score)[0];

            const updatedAt = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            const issueDate = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            let html = `
                <div class="issue-strip">
                    <span>${locationName}</span>
                    <span>${issueDate} <span class="sep">·</span>${updatedAt}</span>
                </div>
            `;

            if (best) {
                html += `
                    <section class="pick">
                        <div>
                            <p class="pick-eyebrow">The Pick</p>
                            <p class="pick-when">${best.dayLabel} <em>${best.hoursText}</em></p>
                            <p class="pick-stats">
                                ${spanText(best.temp, '°')} feels ${spanText(best.feels, '°')}
                                <span class="dot">·</span>${Math.round(best.precip)}% rain
                                <span class="dot">·</span>${Math.round(best.wind)} mph
                            </p>
                        </div>
                        <div class="pick-verdict ${best.rating.class}">${best.rating.label}</div>
                    </section>
                `;
            }

            dayBlocks.forEach(d => {
                html += `
                    <article class="day-entry">
                        <header class="day-head">
                            <h2 class="day-name${d.isToday ? ' is-today' : ''}">
                                ${d.primary}${d.secondary ? ` <em>${d.secondary}</em>` : ''}
                                <span class="day-date">${d.dateFormatted}</span>
                            </h2>
                            ${d.sun ? `<span class="day-sun"><span class="arrow">↑</span>${formatSunTime(d.sun.sunrise)}<span class="arrow">↓</span>${formatSunTime(d.sun.sunset)}</span>` : ''}
                        </header>
                        <div class="windows">
                            ${d.morning ? renderWindow(d.morning) : ''}
                            ${d.evening ? renderWindow(d.evening) : ''}
                        </div>
                    </article>
                `;
            });

            results.innerHTML = html;
        }

        function formatSunTime(iso) {
            const d = new Date(iso);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
                    .replace(' AM', 'a').replace(' PM', 'p');
        }

        // Score every hour in the band, keep the best contiguous stretch, and
        // report what that stretch does from end to end rather than a mean.
        // The reported hours are an output now, so the label names them.
        function summarize(band, sun, dayHours) {
            const lit = daylightBand(band, sun);
            if (!lit) return null;

            const hours = dayHours
                .filter(h => h.hour >= lit.from && h.hour <= lit.to)
                .sort((a, b) => a.hour - b.hour)
                .map(h => ({ ...h, score: getRating(h).score }));

            const best = bestStretch(hours);
            if (!best) return null;

            const pick = best.hours;
            const span = (k) => {
                const vs = pick.map(h => h[k]);
                return { min: Math.min(...vs), max: Math.max(...vs) };
            };

            // Conditions at the ends of the stretch drive the verdict via the
            // mean hourly score, but rain and wind are reported at their worst:
            // a 60% hour inside an otherwise clear window is the thing you need
            // to know, and averaging hides it.
            const rating = ratingFor(best.mean);
            const worstPrecip = Math.max(...pick.map(h => h.precip));
            const worstWind = Math.max(...pick.map(h => h.wind));
            const wbgts = pick.map(h => h.wbgt).filter(v => typeof v === 'number');
            const thunders = pick.map(h => h.thunder).filter(v => typeof v === 'number');
            const peakWbgt = wbgts.length ? Math.max(...wbgts) : null;
            const peakThunder = thunders.length ? Math.max(...thunders) : null;

            const note = getNote({
                feels: span('feelsLike'),
                dew: span('dewPoint'),
                precip: worstPrecip,
                wind: worstWind,
                wbgt: peakWbgt,
                thunder: peakThunder,
            });

            return {
                label: band.label,
                wbgt: peakWbgt,
                thunder: peakThunder,
                // Last hour reads as its own start time, so a 5..6 stretch is
                // "5-7a": you are out for the whole of the 6 o'clock hour.
                hoursText: hourSpan(pick[0].hour, pick[pick.length - 1].hour + 1),
                temp: span('temp'),
                feels: span('feelsLike'),
                dew: span('dewPoint'),
                humidity: span('humidity'),
                precip: worstPrecip,
                wind: worstWind,
                score: best.mean,
                rating,
                note,
            };
        }

        // A span reads as one value when its ends round together, and as a
        // range when they don't. Steady hours stay quiet; a window that climbs
        // 8° says so on its face, which is the whole point of reporting the
        // stretch instead of its mean.
        function spanText({ min, max }, unit = '') {
            const lo = Math.round(min);
            const hi = Math.round(max);
            return lo === hi ? `${lo}${unit}` : `${lo}–${hi}${unit}`;
        }

        // Readings joined by dots, each reading unbreakable and each separator
        // glued to the reading before it. On a phone the row wraps to two
        // lines; without the glue it breaks mid-reading and strands "humidity"
        // under its own number, or starts the second line on a lone dot.
        function statsLine(readings) {
            return readings
                .map((r, i) => `<span class="stat">${r}${
                    i < readings.length - 1 ? '<span class="dot">·</span>' : ''
                }</span>`)
                // <wbr>, not a space: adjacent nowrap spans give the browser no
                // soft-wrap opportunity at all, so the row would refuse to
                // break and overflow instead. This adds the break point without
                // adding width, leaving the dot's own margins to do the
                // spacing.
                .join('<wbr>');
        }

        function renderWindow(w) {
            return `
                <div class="window ${w.rating.class}">
                    <div class="window-body">
                        <p class="window-label">${w.label} <span class="window-hours">${w.hoursText}</span></p>
                        <span class="window-temp">${spanText(w.temp, '°')}</span>
                        <p class="window-feels">feels ${spanText(w.feels, '°')}</p>
                        <p class="window-stats">${statsLine([
                            `${Math.round(w.precip)}% rain`,
                            `${Math.round(w.wind)} mph`,
                            `${spanText(w.dew, '°')} dew`,
                            `${spanText(w.humidity, '%')} humidity`,
                            // Only once it is saying something. Below 80 the
                            // heat stress reading is "fine", which the rest of
                            // the row already covers, and a fifth number on
                            // every line to report nothing is a bad trade.
                            ...(typeof w.wbgt === 'number' && w.wbgt >= WBGT_SHOW
                                ? [`${Math.round(w.wbgt)}° heat stress`]
                                : []),
                        ])}</p>
                        ${w.note ? `<p class="window-note">${w.note}</p>` : ''}
                    </div>
                    <div class="window-rating">
                        <span class="rating-word">${w.rating.label}</span>
                    </div>
                </div>
            `;
        }

        // One hour's runnability, 0-100. Ranks hours against each other; it is
        // deliberately not shown anywhere.
        //
        // This used to charge for humidity up to three times over. It penalised
        // raw temperature, then the gap between temperature and feels-like,
        // then dew point — but feels-like is *derived* from temperature and
        // humidity, so a muggy hour paid for the same fact in all three terms
        // and got shoved toward Skip harder than the model intended.
        //
        // Now the thermal term reads feels-like directly, which is what a body
        // registers and already carries the humidity load. Dew point keeps a
        // smaller term of its own: feels-like understates how much wet air
        // costs you once you are working, which is exactly the case running.
        // The comfortable band for running, in feels-like °F. Outside it, every
        // degree costs.
        const IDEAL_LOW = 42;
        const IDEAL_HIGH = 60;

        // WBGT runs well below air temperature — a Boston August week tops out
        // at 86 and sits at a median of 72, where the heat index for the same
        // hours reads in the 90s. Thresholds that look conservative against a
        // thermometer are inert against this.
        //
        // Tuned to run quality, not to the ACSM risk ladder. Those bands are
        // about heat casualties in organised sport with rest breaks, and a
        // morning that is safe by that measure can still be a bad run: 74-77°
        // air at a 72° dew point is survivable and miserable. Sighted by
        // holding the WBGT path against the feels-like fallback, which already
        // scored that morning Tough while WBGT was calling it Solid.
        //
        // Roughly: 65 Prime, 72 Solid, 75 Tough, 82 and up Skip. The free point
        // sits at 62 rather than 60 so a genuinely good morning can still reach
        // Prime — summer WBGT rarely drops below 60, and a curve starting there
        // meant a 59° dawn came out Solid and no hour all week was ever Prime.
        const WBGT_FREE = 62;
        const WBGT_SLOPE = 3;
        const WBGT_MAX_PENALTY = 72;

        // Print the reading once it is worth a full rating band on its own.
        const WBGT_SHOW = 70;

        // The note stays on the published ACSM lines — moderate risk at 73,
        // high at 82, extreme at 87. The verdict says how the run will go; the
        // note says what the guidance calls it. They are different questions
        // and should not share a number.
        const WBGT_CAUTION = 73;

        function getRating(h) {
            let score = 100;
            const feels = h.feelsLike;
            const hasWbgt = typeof h.wbgt === 'number';

            // Cold always reads from feels-like. WBGT is a heat metric and has
            // nothing to say below the comfortable band; wind chill is what a
            // body actually registers down there.
            if (feels < IDEAL_LOW) score -= Math.min(45, (IDEAL_LOW - feels) * 1.6);

            if (hasWbgt) {
                if (h.wbgt > WBGT_FREE) {
                    score -= Math.min(WBGT_MAX_PENALTY, (h.wbgt - WBGT_FREE) * WBGT_SLOPE);
                }
                // No separate dew term here on purpose. WBGT already carries
                // humidity through its wet bulb component, and charging for the
                // same air twice is the exact mistake this scoring just came
                // out of.
            } else {
                // Continuous, not stepped. The old ladder had four rungs, so
                // 79° and 81° scored identically — survivable when the job was
                // rubber-stamping a fixed block, useless now that the score has
                // to rank hours and pick where a window starts and ends.
                if (feels > IDEAL_HIGH) score -= Math.min(45, (feels - IDEAL_HIGH) * 1.6);
                if (h.dewPoint > 55) score -= Math.min(15, (h.dewPoint - 55) * 0.75);
            }

            score -= Math.min(35, h.precip * 0.45);

            // Below 8mph is just air.
            if (h.wind > 8) score -= Math.min(25, (h.wind - 8) * 1.8);

            // Lightning is not a comfort question.
            if (typeof h.thunder === 'number' && h.thunder > 10) {
                score -= Math.min(40, h.thunder * 0.7);
            }

            score = Math.max(0, score);
            return { score, rating: ratingFor(score) };
        }

        function ratingFor(score) {
            if (score >= 85) return { class: 'perfect',     label: 'Prime' };
            if (score >= 65) return { class: 'solid',       label: 'Solid' };
            if (score >= 45) return { class: 'challenging', label: 'Tough' };
            return                  { class: 'skip',        label: 'Skip'  };
        }

        // Reads the harshest end of the reported stretch: these name what to
        // expect at its worst, not on average.
        function getNote(w) {
            const notes = [];
            const hasWbgt = typeof w.wbgt === 'number';

            if (w.feels.min < 32) notes.push('ice risk');
            // With WBGT in hand the heat note can say how much heat, in the
            // terms the guidance is actually written in, instead of one flat
            // "heat" for everything above 80°.
            else if (hasWbgt) {
                if (w.wbgt >= 87)      notes.push('dangerous heat');
                else if (w.wbgt >= 82) notes.push('heat, ease off');
                else if (w.wbgt >= WBGT_CAUTION) notes.push('heat caution');
            }
            else if (w.feels.max > 80) notes.push('heat');

            if (typeof w.thunder === 'number') {
                if (w.thunder >= 30) notes.push('thunder likely');
                else if (w.thunder >= 10) notes.push('thunder possible');
            }

            const precip = w.precip, wind = w.wind, dew = w.dew.max;
            if (precip > 60) notes.push('heavy rain likely');
            else if (precip > 30) notes.push('rain possible');
            if (wind > 20) notes.push('strong headwind');
            else if (wind > 15) notes.push('breezy');
            // Skipped when WBGT is present: the heat note above already speaks
            // for the wet air, and stacking "heat caution · oppressive" says
            // one thing twice.
            //
            // "oppressive" is the National Weather Service's own word for a dew
            // point this high, so it stays — but "oppressive humidity" said
            // humidity twice, given the sibling note is "muggy".
            if (!hasWbgt) {
                if (dew > 70) notes.push('oppressive');
                else if (dew > 65) notes.push('muggy');
            }
            return notes.length > 0 ? notes.join(' · ') : null;
        }

        window.onload = () => {
            const input = document.getElementById('location');
            input.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_LOCATION;
            if (input.value) fetchWeather();
        };
    </script>
</body>
</html>
