<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Weather — A Weekly Almanac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f7f4ec;
            --paper-deep: #ECE4D0;
            --ink: #1a1813;
            --ink-soft: #2A241D;
            --muted: #7a7466;
            --faint: #B4A795;
            --hairline: rgba(24, 20, 16, 0.12);
            --rule: rgba(24, 20, 16, 0.85);
            --accent: #9C3E26;

            --perfect: #3E5A3A;
            --solid: #3E5A6E;
            --tough: #8C6418;
            --skip: #8E3727;

            --serif: 'Fraunces', 'Times New Roman', serif;
            --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
            /* Suite label face (SUITE.md). Was never loaded here. */
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }


        /* Suite bar. Deliberately dark on this light page: the bar is chrome
           belonging to setlist.run, not to Run Weather, so it stays the same
           across the suite whatever the host app's own theme is. Matches the
           bar on training.setlist.run and gradient.setlist.run. */
        .suitebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 9px 20px;
            background: #16140f;
            border-bottom: 1px solid rgba(241, 237, 226, 0.13);
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.4;
        }
        .suitebar a { text-decoration: none; white-space: nowrap; }
        .suitebar .hub { color: #f1ede2; letter-spacing: 0.06em; }
        .suitebar .hub span { color: #9a9384; opacity: 0.6; margin-left: 8px; }
        .suitebar nav { display: flex; gap: 18px; flex-wrap: wrap; }
        .suitebar nav a { color: #9a9384; }
        .suitebar nav a:hover { color: #f1ede2; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: var(--paper); }

        body {
            font-family: var(--sans);
            font-variation-settings: "opsz" 14, "SOFT" 40;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.4;
        }

        ::selection { background: var(--ink); color: var(--paper); }

        .container {
            max-width: 620px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ───────── Masthead ───────── */

        .masthead {
            padding: 44px 0 20px;
            border-bottom: 1px solid var(--hairline);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
        }

        .mark {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .title {
            font-family: var(--serif);
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -0.025em;
            line-height: 1;
            font-variation-settings: "opsz" 96, "SOFT" 60;
            color: var(--ink);
        }

        .title em {
            font-style: italic;
            font-weight: 400;
            color: var(--accent);
        }

        .tagline {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ───────── Search ───────── */

        .search {
            padding: 18px 0;
            display: flex;
            gap: 14px;
            align-items: center;
            border-bottom: 1px solid var(--hairline);
        }

        .search-label {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }

        input {
            flex: 1;
            padding: 4px 0;
            background: transparent;
            border: none;
            color: var(--ink);
            font-family: var(--serif);
            font-size: 16px;
            font-style: italic;
            font-variation-settings: "opsz" 24, "SOFT" 30;
            outline: none;
        }

        input::placeholder { color: var(--faint); font-style: italic; }

        button {
            background: transparent;
            border: none;
            color: var(--ink);
            cursor: pointer;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 6px 10px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            transition: background 0.15s, color 0.15s;
        }

        button:hover {
            background: var(--ink);
            color: var(--paper);
        }

        button:disabled { opacity: 0.4; cursor: not-allowed; background: transparent; color: var(--ink); }

        /* ───────── Issue strip ───────── */

        .issue-strip {
            padding: 14px 0;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--hairline);
        }

        .issue-strip .sep { color: var(--faint); margin: 0 8px; }

        /* ───────── The Pick ───────── */

        .pick {
            margin: 0 -24px;
            padding: 32px 24px 36px;
            background: var(--paper-deep);
            border-top: 1px solid var(--hairline);
            border-bottom: 1px solid var(--hairline);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: end;
            animation: rise 0.5s ease-out both;
        }

        .pick-eyebrow {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .pick-when {
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 500;
            font-variation-settings: "opsz" 60, "SOFT" 50;
            line-height: 1.15;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
        }

        .pick-when em {
            font-style: italic;
            font-weight: 400;
            color: var(--muted);
        }

        .pick-stats {
            font-family: var(--sans);
            font-size: 12px;
            color: var(--muted);
            font-feature-settings: "tnum";
            letter-spacing: 0.01em;
        }

        .pick-stats .dot {
            color: var(--faint);
            margin: 0 7px;
        }

        .pick-score {
            font-family: var(--serif);
            font-size: 76px;
            font-style: italic;
            font-weight: 300;
            line-height: 0.85;
            letter-spacing: -0.04em;
            color: var(--ink);
            font-variation-settings: "opsz" 144, "SOFT" 90;
            font-feature-settings: "tnum";
            text-align: right;
        }

        /* ───────── Day entry ───────── */

        .day-entry {
            padding: 22px 0 24px;
            border-bottom: 1px solid var(--hairline);
            animation: rise 0.4s ease-out both;
        }

        .day-entry:nth-child(2) { animation-delay: 0.04s; }
        .day-entry:nth-child(3) { animation-delay: 0.08s; }
        .day-entry:nth-child(4) { animation-delay: 0.12s; }
        .day-entry:nth-child(5) { animation-delay: 0.16s; }
        .day-entry:nth-child(6) { animation-delay: 0.20s; }
        .day-entry:nth-child(7) { animation-delay: 0.24s; }

        .day-head {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 14px;
            align-items: baseline;
            margin-bottom: 18px;
        }

        .day-num {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--faint);
            font-feature-settings: "tnum";
        }

        .day-name {
            font-family: var(--serif);
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.1;
            font-variation-settings: "opsz" 36, "SOFT" 40;
        }

        .day-name em {
            font-style: italic;
            font-weight: 400;
            color: var(--muted);
            font-size: 0.72em;
            margin-left: 8px;
        }

        .day-name.is-today em { color: var(--accent); }

        .day-sun {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--muted);
            font-feature-settings: "tnum";
            white-space: nowrap;
        }

        .day-sun .arrow {
            color: var(--faint);
            margin: 0 3px 0 10px;
        }
        .day-sun .arrow:first-child { margin-left: 0; }

        .day-date {
            display: block;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--faint);
            margin-top: 4px;
        }

        /* ───────── Window ───────── */

        .windows { display: grid; gap: 16px; }

        .window {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 18px;
            align-items: start;
            padding-left: 14px;
            border-left: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .window.perfect     { border-left-color: var(--perfect); }
        .window.solid       { border-left-color: var(--solid); }
        .window.challenging { border-left-color: var(--tough); }
        .window.skip        { border-left-color: var(--skip); }

        .window-label {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .window-temp {
            font-family: var(--serif);
            font-size: 30px;
            font-style: italic;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--ink);
            font-variation-settings: "opsz" 60, "SOFT" 70;
            font-feature-settings: "tnum";
            display: inline-block;
        }

        .window-feels {
            font-family: var(--sans);
            font-size: 11px;
            color: var(--muted);
            font-feature-settings: "tnum";
            margin-top: 2px;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
        }

        .window-stats {
            font-family: var(--sans);
            font-size: 12px;
            color: var(--ink-soft);
            font-feature-settings: "tnum";
            letter-spacing: 0.01em;
            line-height: 1.5;
        }

        .window-stats .dot {
            color: var(--faint);
            margin: 0 7px;
        }

        .window-note {
            margin-top: 6px;
            font-family: var(--serif);
            font-size: 12px;
            font-style: italic;
            color: var(--muted);
            font-variation-settings: "opsz" 14;
        }

        .window-note::before {
            content: "— ";
            color: var(--faint);
        }

        .window-rating { text-align: right; align-self: center; }

        .rating-word {
            font-family: var(--serif);
            font-size: 26px;
            font-style: italic;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.015em;
            font-variation-settings: "opsz" 60, "SOFT" 80;
        }

        .window.perfect     .rating-word { color: var(--perfect); }
        .window.solid       .rating-word { color: var(--solid); }
        .window.challenging .rating-word { color: var(--tough); }
        .window.skip        .rating-word { color: var(--skip); }

        .rating-word::after { content: "."; color: currentColor; }

        /* ───────── States ───────── */

        .loading {
            padding: 60px 0;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 0.01em;
            animation: breathe 1.8s ease-in-out infinite;
            font-variation-settings: "opsz" 18, "SOFT" 50;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        .error {
            padding: 36px 0;
            text-align: center;
            color: var(--skip);
            font-family: var(--serif);
            font-style: italic;
            font-size: 14px;
            border-bottom: 1px solid var(--hairline);
        }

        .error::before { content: "— "; color: var(--faint); }
        .error::after  { content: " —"; color: var(--faint); }

        /* ───────── Colophon ───────── */

        .colophon {
            padding: 40px 0 56px;
            text-align: center;
            border-top: 1px solid var(--hairline);
            margin-top: 24px;
        }

        .colophon-main {
            font-family: var(--serif);
            font-size: 15px;
            font-style: italic;
            font-variation-settings: "opsz" 20, "SOFT" 60;
            color: var(--ink);
            letter-spacing: -0.005em;
            margin-bottom: 10px;
        }

        .colophon-main a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 1px;
            transition: opacity 0.2s;
        }

        .colophon-main a:hover { opacity: 0.7; }

        .colophon-sub {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .colophon-sub a {
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid var(--hairline);
            padding-bottom: 1px;
            transition: color 0.2s, border-color 0.2s;
        }

        .colophon-sub a:hover { color: var(--ink); border-color: var(--ink); }

        .colophon-sub .sep { color: var(--faint); margin: 0 8px; }

        /* ───────── Suite ───────── */

        .suite-label {
            font-family: var(--sans); font-size: 10px; font-weight: 500;
            letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint);
            margin-bottom: 12px;
        }
        .suite {
            display: flex; flex-wrap: wrap; justify-content: center;
            margin-bottom: 24px; font-family: var(--sans); font-size: 11px;
            letter-spacing: 0.03em;
        }
        .suite a, .suite span.cur {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 5px 14px; color: var(--muted); text-decoration: none;
            border-left: 1px solid var(--hairline); transition: color 0.2s;
        }
        .suite > :first-child { border-left: none; }
        .suite a:hover { color: var(--ink); }
        .suite span.cur { color: var(--ink); font-weight: 600; }
        .suite .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }

        /* ───────── Motion ───────── */

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0);   }
        }

        @media (max-width: 480px) {
            .container { padding: 0 18px; }
            .masthead {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 32px 0 16px;
            }
            .pick {
                grid-template-columns: 1fr auto;
                margin: 0 -18px;
                padding: 26px 18px 28px;
            }
            .pick-when { font-size: 20px; }
            .pick-score { font-size: 60px; }
            .day-head {
                grid-template-columns: auto 1fr;
                row-gap: 6px;
            }
            .day-sun { grid-column: 1 / -1; }
            .window-temp { font-size: 26px; }
            .rating-word { font-size: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <header class="suitebar">
        <a class="hub" href="https://setlist.run">setlist.run<span>suite</span></a>
        <nav>
            <a href="https://setlist.run">Setlist</a>
            <a href="https://training.setlist.run">Training Load</a>
            <a href="https://gradient.setlist.run">Gradient</a>
        </nav>
    </header>
    <div class="container">

        <header class="masthead">
            <div class="mark">
                <h1 class="title">Run <em>Weather</em></h1>
            </div>
            <p class="tagline">A Weekly Almanac</p>
        </header>

        <div class="search">
            <span class="search-label">Location</span>
            <input
                type="text"
                id="location"
                placeholder="enter a city or postal code…"
                onkeydown="if(event.key === 'Enter') fetchWeather()"
                autocomplete="off"
                spellcheck="false"
            >
            <button id="goBtn" onclick="fetchWeather()">Read</button>
        </div>

        <div id="results"></div>

        <footer class="colophon">
            <div class="suite-label">The setlist.run suite</div>
            <nav class="suite">
                <a href="https://setlist.run"><span class="dot" style="background:#fc4c02"></span>Setlist</a>
                <a href="https://training.setlist.run"><span class="dot" style="background:#12a594"></span>Training Load</a>
                <span class="cur"><span class="dot" style="background:#9C3E26"></span>Run Weather</span>
                <a href="https://gradient.setlist.run"><span class="dot" style="background:linear-gradient(90deg,#2fb344,#f59f00,#e03131)"></span>Gradient</a>
            </nav>
            <p class="colophon-main">
                Built by <a href="https://setlist.run" target="_blank" rel="noopener">setlist.run</a>
            </p>
            <p class="colophon-sub">
                Data, <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
                <span class="sep">·</span>
                Set in <a href="https://fonts.google.com/specimen/Fraunces" target="_blank" rel="noopener">Fraunces</a>
            </p>
        </footer>
    </div>

    <script>
        const STORAGE_KEY = 'run-weather:last-location';
        const DEFAULT_LOCATION = '02131';

        async function fetchWeather() {
            const input = document.getElementById('location');
            const btn = document.getElementById('goBtn');
            const location = input.value.trim();
            const results = document.getElementById('results');

            if (!location) {
                results.innerHTML = '<div class="error">enter a location</div>';
                return;
            }

            btn.disabled = true;
            results.innerHTML = '<div class="loading">gathering readings…</div>';

            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error('location not found');
                }

                const { latitude, longitude, name, admin1, country_code } = geoData.results[0];
                const label = [name, admin1, country_code].filter(Boolean).join(', ');

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,apparent_temperature,precipitation_probability,windspeed_10m,relative_humidity_2m,dew_point_2m&daily=sunrise,sunset&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=7`);
                const weather = await weatherRes.json();

                localStorage.setItem(STORAGE_KEY, location);
                displayForecast(weather, label);
            } catch (error) {
                results.innerHTML = `<div class="error">${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function displayForecast(weather, locationName) {
            const results = document.getElementById('results');
            const days = {};
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            weather.hourly.time.forEach((time, i) => {
                const date = new Date(time);
                const dayKey = date.toISOString().split('T')[0];
                if (!days[dayKey]) days[dayKey] = [];
                days[dayKey].push({
                    hour: date.getHours(),
                    temp: weather.hourly.temperature_2m[i],
                    feelsLike: weather.hourly.apparent_temperature[i],
                    precip: weather.hourly.precipitation_probability[i],
                    wind: weather.hourly.windspeed_10m[i],
                    humidity: weather.hourly.relative_humidity_2m[i],
                    dewPoint: weather.hourly.dew_point_2m[i]
                });
            });

            const sunByDay = {};
            if (weather.daily && weather.daily.time) {
                weather.daily.time.forEach((d, i) => {
                    sunByDay[d] = {
                        sunrise: weather.daily.sunrise[i],
                        sunset: weather.daily.sunset[i]
                    };
                });
            }

            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            const candidates = [];
            const dayBlocks = [];
            let dayNum = 0;

            Object.entries(days).forEach(([dateStr, hours]) => {
                const date = new Date(dateStr);
                date.setHours(0, 0, 0, 0);
                if (date < today) return;

                dayNum += 1;

                let primary, secondary;
                if (date.getTime() === today.getTime())         { primary = 'Today';    secondary = date.toLocaleDateString('en-US', { weekday: 'long' }); }
                else if (date.getTime() === tomorrow.getTime()) { primary = 'Tomorrow'; secondary = date.toLocaleDateString('en-US', { weekday: 'long' }); }
                else                                            { primary = date.toLocaleDateString('en-US', { weekday: 'long' }); secondary = ''; }

                const dateFormatted = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const isToday = date.getTime() === today.getTime();

                const morning = summarize('Early Morning', hours.filter(h => h.hour >= 5 && h.hour <= 9));
                const evening = summarize('Evening',       hours.filter(h => h.hour >= 16 && h.hour <= 20));

                [morning, evening].forEach(w => {
                    if (w) candidates.push({ ...w, dayLabel: primary });
                });

                dayBlocks.push({
                    dayNum, primary, secondary, dateFormatted, isToday,
                    sun: sunByDay[dateStr], morning, evening
                });
            });

            const best = candidates
                .filter(c => c.rating.class === 'perfect' || c.rating.class === 'solid')
                .sort((a, b) => b.score - a.score)[0]
                || candidates.sort((a, b) => b.score - a.score)[0];

            const updatedAt = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            const issueDate = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            let html = `
                <div class="issue-strip">
                    <span>${locationName}</span>
                    <span>${issueDate} <span class="sep">·</span>${updatedAt}</span>
                </div>
            `;

            if (best) {
                html += `
                    <section class="pick">
                        <div>
                            <p class="pick-eyebrow">The Pick</p>
                            <p class="pick-when">${best.dayLabel} <em>${best.label.toLowerCase()}</em></p>
                            <p class="pick-stats">
                                ${Math.round(best.avgTemp)}° feels ${Math.round(best.avgFeels)}°
                                <span class="dot">·</span>${Math.round(best.maxPrecip)}% rain
                                <span class="dot">·</span>${Math.round(best.avgWind)} mph
                            </p>
                        </div>
                        <div class="pick-score">${best.score}</div>
                    </section>
                `;
            }

            dayBlocks.forEach(d => {
                html += `
                    <article class="day-entry">
                        <header class="day-head">
                            <span class="day-num">№${String(d.dayNum).padStart(2, '0')}</span>
                            <h2 class="day-name${d.isToday ? ' is-today' : ''}">
                                ${d.primary}${d.secondary ? ` <em>${d.secondary}</em>` : ''}
                                <span class="day-date">${d.dateFormatted}</span>
                            </h2>
                            ${d.sun ? `<span class="day-sun"><span class="arrow">↑</span>${formatSunTime(d.sun.sunrise)}<span class="arrow">↓</span>${formatSunTime(d.sun.sunset)}</span>` : ''}
                        </header>
                        <div class="windows">
                            ${d.morning ? renderWindow(d.morning) : ''}
                            ${d.evening ? renderWindow(d.evening) : ''}
                        </div>
                    </article>
                `;
            });

            results.innerHTML = html;
        }

        function formatSunTime(iso) {
            const d = new Date(iso);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
                    .replace(' AM', 'a').replace(' PM', 'p');
        }

        function summarize(label, hours) {
            if (hours.length === 0) return null;
            const avg = k => hours.reduce((s, h) => s + h[k], 0) / hours.length;
            const avgTemp = avg('temp');
            const avgFeels = avg('feelsLike');
            const maxPrecip = Math.max(...hours.map(h => h.precip));
            const avgWind = avg('wind');
            const avgDew = avg('dewPoint');
            const avgHumidity = avg('humidity');
            const { score, rating } = getRating(avgTemp, avgFeels, maxPrecip, avgWind, avgDew);
            const note = getNote(avgTemp, avgFeels, maxPrecip, avgWind, avgDew);
            return { label, avgTemp, avgFeels, maxPrecip, avgWind, avgDew, avgHumidity, score, rating, note };
        }

        function renderWindow(w) {
            return `
                <div class="window ${w.rating.class}">
                    <div class="window-body">
                        <p class="window-label">${w.label}</p>
                        <span class="window-temp">${Math.round(w.avgTemp)}°</span>
                        <p class="window-feels">feels ${Math.round(w.avgFeels)}°</p>
                        <p class="window-stats">
                            ${Math.round(w.maxPrecip)}% rain
                            <span class="dot">·</span>${Math.round(w.avgWind)} mph
                            <span class="dot">·</span>${Math.round(w.avgDew)}° dew
                        </p>
                        ${w.note ? `<p class="window-note">${w.note}</p>` : ''}
                    </div>
                    <div class="window-rating">
                        <span class="rating-word">${w.rating.label}</span>
                    </div>
                </div>
            `;
        }

        function getRating(temp, feels, precip, wind, dew) {
            let score = 100;

            if (temp < 20 || temp > 80) score -= 40;
            else if (temp < 32 || temp > 70) score -= 25;
            else if (temp < 38 || temp > 62) score -= 15;
            else if (temp < 40 || temp > 58) score -= 8;

            const feelsDiff = Math.abs(temp - feels);
            if (feelsDiff > 15) score -= 25;
            else if (feelsDiff > 10) score -= 15;
            else if (feelsDiff > 5) score -= 8;

            if (precip > 70) score -= 35;
            else if (precip > 50) score -= 25;
            else if (precip > 30) score -= 15;
            else if (precip > 15) score -= 8;

            if (wind > 20) score -= 25;
            else if (wind > 15) score -= 15;
            else if (wind > 12) score -= 8;

            if (dew > 70) score -= 25;
            else if (dew > 65) score -= 15;
            else if (dew > 60) score -= 8;
            else if (dew > 55) score -= 3;

            score = Math.max(0, score);

            let rating;
            if (score >= 85)      rating = { class: 'perfect',     label: 'Perfect' };
            else if (score >= 65) rating = { class: 'solid',       label: 'Solid' };
            else if (score >= 45) rating = { class: 'challenging', label: 'Tough' };
            else                  rating = { class: 'skip',        label: 'Skip' };

            return { score, rating };
        }

        function getNote(temp, feels, precip, wind, dew) {
            const notes = [];
            if (temp < 32) notes.push('ice risk');
            else if (temp > 75) notes.push('heat');
            if (precip > 60) notes.push('heavy rain likely');
            else if (precip > 30) notes.push('rain possible');
            if (wind > 20) notes.push('strong headwind');
            else if (wind > 15) notes.push('breezy');
            const feelsDiff = feels - temp;
            if (feelsDiff < -10) notes.push('wind chill');
            else if (feelsDiff > 10) notes.push('humidity factor');
            if (dew > 70) notes.push('oppressive humidity');
            else if (dew > 65) notes.push('muggy');
            return notes.length > 0 ? notes.join(' · ') : null;
        }

        window.onload = () => {
            const input = document.getElementById('location');
            input.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_LOCATION;
            if (input.value) fetchWeather();
        };
    </script>
</body>
</html>
