<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FC4C02;
            --dark: #1a1a1a;
            --gray-900: #2a2a2a;
            --gray-800: #3a3a3a;
            --gray-700: #4a4a4a;
            --gray-600: #6a6a6a;
            --gray-500: #8a8a8a;
            --gray-400: #aaa;
            --gray-300: #ccc;
            --gray-200: #e0e0e0;
            --gray-100: #f5f5f5;
            --white: #ffffff;
            --green: #00D46E;
            --yellow: #FFB800;
            --red: #FF3B30;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 0;
        }
        
        header {
            padding: 48px 20px 32px;
            background: linear-gradient(180deg, var(--dark) 0%, var(--gray-900) 100%);
            border-bottom: 1px solid var(--gray-800);
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: var(--gray-400);
            font-size: 15px;
            font-weight: 500;
        }
        
        .location-bar {
            padding: 16px 20px;
            background: var(--gray-900);
            border-bottom: 1px solid var(--gray-800);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        input {
            flex: 1;
            padding: 12px 16px;
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
            border-radius: 8px;
            color: var(--white);
            font-size: 15px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--orange);
            background: var(--gray-900);
        }
        
        input::placeholder {
            color: var(--gray-500);
        }
        
        button {
            padding: 12px 20px;
            background: var(--orange);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        
        button:hover {
            background: #e64502;
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .loading {
            text-align: center;
            color: var(--gray-400);
            padding: 60px 20px;
            font-size: 15px;
        }
        
        .forecast {
            padding: 20px;
        }
        
        .day-card {
            background: var(--gray-900);
            border: 1px solid var(--gray-800);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        
        .day-header {
            padding: 16px 20px;
            background: var(--gray-800);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .day-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .day-date {
            color: var(--gray-400);
            font-size: 14px;
            font-weight: 500;
        }
        
        .windows {
            padding: 4px;
        }
        
        .window {
            padding: 16px;
            margin: 4px 0;
            border-radius: 8px;
            background: var(--gray-800);
            border-left: 3px solid;
        }
        
        .window.perfect {
            border-color: var(--green);
            background: rgba(0, 212, 110, 0.08);
        }
        
        .window.solid {
            border-color: #00A8E8;
            background: rgba(0, 168, 232, 0.08);
        }
        
        .window.challenging {
            border-color: var(--yellow);
            background: rgba(255, 184, 0, 0.08);
        }
        
        .window.skip {
            border-color: var(--red);
            background: rgba(255, 59, 48, 0.08);
        }
        
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .window-time {
            font-weight: 600;
            font-size: 15px;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .perfect .badge {
            background: var(--green);
            color: var(--dark);
        }
        
        .solid .badge {
            background: #00A8E8;
            color: var(--white);
        }
        
        .challenging .badge {
            background: var(--yellow);
            color: var(--dark);
        }
        
        .skip .badge {
            background: var(--red);
            color: var(--white);
        }
        
        .stats {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: var(--gray-300);
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stat strong {
            color: var(--white);
            font-weight: 600;
        }
        
        .note {
            margin-top: 8px;
            font-size: 13px;
            color: var(--gray-400);
            font-style: italic;
        }
        
        .error {
            background: var(--gray-900);
            border: 1px solid var(--gray-800);
            border-radius: 12px;
            padding: 24px;
            margin: 20px;
            text-align: center;
            color: var(--red);
        }
        
        footer {
            padding: 40px 20px;
            text-align: center;
            color: var(--gray-500);
            font-size: 13px;
        }
        
        footer a {
            color: var(--orange);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Run Weather</h1>
            <p class="subtitle">Plan your training windows</p>
        </header>
        
        <div class="location-bar">
            <div class="input-group">
                <input 
                    type="text" 
                    id="location" 
                    placeholder="Enter city or zip..." 
                    value="02131"
                    onkeydown="if(event.key === 'Enter') fetchWeather()"
                >
                <button onclick="fetchWeather()">Go</button>
            </div>
        </div>
        
        <div id="results"></div>
        
        <footer>
            Built with <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>
        </footer>
    </div>
    
    <script>
        async function fetchWeather() {
            const location = document.getElementById('location').value.trim();
            const results = document.getElementById('results');
            
            if (!location) {
                results.innerHTML = '<div class="error">Please enter a city</div>';
                return;
            }
            
            results.innerHTML = '<div class="loading">Loading forecast...</div>';
            
            try {
                // Geocode
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();
                
                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error('City not found');
                }
                
                const { latitude, longitude, name } = geoData.results[0];
                
                // Fetch weather
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,precipitation_probability,windspeed_10m,apparent_temperature&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=7`);
                const weather = await weatherRes.json();
                
                displayForecast(weather, name);
            } catch (error) {
                results.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }
        
        function displayForecast(weather, locationName) {
            const results = document.getElementById('results');
            const days = {};
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Group by day
            weather.hourly.time.forEach((time, i) => {
                const date = new Date(time);
                const dayKey = date.toISOString().split('T')[0];
                
                if (!days[dayKey]) days[dayKey] = [];
                
                days[dayKey].push({
                    hour: date.getHours(),
                    temp: weather.hourly.temperature_2m[i],
                    feelsLike: weather.hourly.apparent_temperature[i],
                    precip: weather.hourly.precipitation_probability[i],
                    wind: weather.hourly.windspeed_10m[i]
                });
            });
            
            let html = '<div class="forecast">';
            
            Object.entries(days).forEach(([dateStr, hours]) => {
                const date = new Date(dateStr);
                date.setHours(0, 0, 0, 0);
                
                // Skip past days
                if (date < today) return;
                const date = new Date(dateStr);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
                const dateFormatted = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                
                // Morning window (5am-9am)
                const morning = hours.filter(h => h.hour >= 5 && h.hour <= 9);
                // Evening window (4pm-8pm)
                const evening = hours.filter(h => h.hour >= 16 && h.hour <= 20);
                
                html += `
                    <div class="day-card">
                        <div class="day-header">
                            <span class="day-name">${dayName}</span>
                            <span class="day-date">${dateFormatted}</span>
                        </div>
                        <div class="windows">
                            ${renderWindow('Early Morning', morning)}
                            ${renderWindow('Evening', evening)}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            results.innerHTML = html;
        }
        
        function renderWindow(label, hours) {
            if (hours.length === 0) return '';
            
            const avgTemp = hours.reduce((sum, h) => sum + h.temp, 0) / hours.length;
            const avgFeels = hours.reduce((sum, h) => sum + h.feelsLike, 0) / hours.length;
            const maxPrecip = Math.max(...hours.map(h => h.precip));
            const avgWind = hours.reduce((sum, h) => sum + h.wind, 0) / hours.length;
            
            const rating = getRating(avgTemp, avgFeels, maxPrecip, avgWind);
            const note = getNote(avgTemp, avgFeels, maxPrecip, avgWind);
            
            return `
                <div class="window ${rating.class}">
                    <div class="window-header">
                        <div class="window-time">${label}</div>
                        <div class="badge">${rating.label}</div>
                    </div>
                    <div class="stats">
                        <div class="stat">
                            <span><strong>${Math.round(avgTemp)}°</strong> feels ${Math.round(avgFeels)}°</span>
                        </div>
                        <div class="stat">
                            <span>${Math.round(maxPrecip)}% rain</span>
                        </div>
                        <div class="stat">
                            <span>${Math.round(avgWind)} mph wind</span>
                        </div>
                    </div>
                    ${note ? `<div class="note">${note}</div>` : ''}
                </div>
            `;
        }
        
        function getRating(temp, feels, precip, wind) {
            let score = 100;
            
            // Ideal: 40-55°F
            if (temp < 20 || temp > 80) score -= 40;
            else if (temp < 32 || temp > 70) score -= 25;
            else if (temp < 38 || temp > 62) score -= 15;
            else if (temp < 40 || temp > 58) score -= 8;
            
            // Feels-like matters
            const feelsDiff = Math.abs(temp - feels);
            if (feelsDiff > 15) score -= 25;
            else if (feelsDiff > 10) score -= 15;
            else if (feelsDiff > 5) score -= 8;
            
            // Rain
            if (precip > 70) score -= 35;
            else if (precip > 50) score -= 25;
            else if (precip > 30) score -= 15;
            else if (precip > 15) score -= 8;
            
            // Wind
            if (wind > 20) score -= 25;
            else if (wind > 15) score -= 15;
            else if (wind > 12) score -= 8;
            
            if (score >= 85) return { class: 'perfect', label: 'Perfect' };
            if (score >= 65) return { class: 'solid', label: 'Solid' };
            if (score >= 45) return { class: 'challenging', label: 'Tough' };
            return { class: 'skip', label: 'Skip' };
        }
        
        function getNote(temp, feels, precip, wind) {
            const notes = [];
            
            if (temp < 32) notes.push('Ice risk');
            else if (temp > 75) notes.push('Heat warning');
            
            if (precip > 60) notes.push('Heavy rain likely');
            else if (precip > 30) notes.push('Light rain possible');
            
            if (wind > 20) notes.push('Strong headwind');
            else if (wind > 15) notes.push('Breezy');
            
            const feelsDiff = feels - temp;
            if (feelsDiff < -10) notes.push('Wind chill factor');
            else if (feelsDiff > 10) notes.push('Humidity factor');
            
            return notes.length > 0 ? notes.join(' · ') : null;
        }
        
        // Auto-load on page load
        window.onload = () => fetchWeather();
    </script>
</body>
</html>
